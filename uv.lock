version = 1
revision = 3
requires-python = ">=3.14"

[manifest]
members = [
    "ocfl-cli",
    "ocfl-lib",
    "ofcl",
]

[[package]]
name = "ocfl-cli"
version = "0.1.0"
source = { virtual = "packages/ocfl-cli" }
dependencies = [
    { name = "ocfl-lib" },
]

[package.metadata]
requires-dist = [{ name = "ocfl-lib", editable = "packages/ocfl-lib" }]

[[package]]
name = "ocfl-lib"
version = "0.1.0"
source = { editable = "packages/ocfl-lib" }

[[package]]
name = "ofcl"
version = "0.1.0"
source = { virtual = "." }
