[project]
name = "ocfl"
version = "0.1.0"
description = "OCFL workspace"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ty>=0.0.24",
    "ruff>=0.9",
    "hypothesis>=6.152.2",
    "ocfl-lib[test]",
    "ocfl-cli[test]",
    "ocfl-index",
    "mypy-boto3-s3>=1.42.80",
    "import-linter>=2.15",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ocfl-lib = { workspace = true }
ocfl-cli = { workspace = true }
ocfl-index = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/ocfl-lib/tests",
    "packages/ocfl-cli/tests",
    "packages/ocfl-index/tests",
]
pythonpath = ["."]
markers = ["bitcoin: requires bitcoind regtest subprocess"]

[tool.ty.src]
include = [
    "packages/ocfl-cli/src",
    "packages/ocfl-cli/tests",
    "packages/ocfl-lib/src",
    "packages/ocfl-lib/tests",
    "packages/ocfl-index/src",
    "packages/ocfl-index/tests",
    "tests",
]

[tool.importlinter]
root_packages = ["ocfl_cli", "ocfl_lib"]

[[tool.importlinter.contracts]]
name = "ocfl_lib never imports ocfl_cli (ADR-0002)"
type = "forbidden"
source_modules = ["ocfl_lib"]
forbidden_modules = ["ocfl_cli"]

[[tool.importlinter.contracts]]
# docs/adr/0003-cli-layers.md. Each layer may import the layers below it.
name = "ocfl-cli layers: commands -> use cases -> adapters"
type = "layers"
containers = ["ocfl_cli"]
exhaustive = true
layers = [
    "main",
    "archive | stage",
    "_appctx : _common : _exit : _style : exit_codes",
    "workflow",
    "ots | store",
    "config : errors : model : ports",
]

[[tool.importlinter.contracts]]
name = "commands reach adapters only through the use cases"
type = "forbidden"
source_modules = [
    "ocfl_cli.archive",
    "ocfl_cli.stage",
    "ocfl_cli._appctx",
    "ocfl_cli._common",
    "ocfl_cli._exit",
    "ocfl_cli._style",
    "ocfl_cli.exit_codes",
]
forbidden_modules = ["ocfl_cli.ots", "ocfl_cli.store"]
allow_indirect_imports = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["ocfl_lib", "ocfl_cli", "ocfl_index"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["TC"]
# ocfl-index intentionally hoists imports to module scope; PEP 649 makes
# from __future__ import annotations a no-op on 3.14+ and none of its
# TYPE_CHECKING guards were circular or expensive (see 58fd37e).
"packages/ocfl-index/src/**" = ["TC"]

