[project]
name = "ocfl-index"
version = "0.1.0"
description = "SQLite cache of an OCFL storage root for projector consumption"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "ocfl-lib",
    "python-magic>=0.4",
    "opentimestamps>=0.4",
    "typer>=0.15",
]

[project.scripts]
ocfl-index = "ocfl_index.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocfl_index"]

[tool.uv.sources]
ocfl-lib = { workspace = true }
