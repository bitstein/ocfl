[project]
name = "ocfl-lib"
version = "0.1.0"
description = "Library for implementing OCFL"
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.20.0",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.35.0",
]
test = [
    "moto[s3]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocfl_lib"]

[dependency-groups]
dev = [
    "mypy-boto3-s3>=1.42.80",
]
