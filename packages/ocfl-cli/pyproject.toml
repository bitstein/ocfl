[project]
name = "ocfl-cli"
version = "0.1.0"
description = "CLI for managing an OCFL archive"
requires-python = ">=3.14"
dependencies = [
    "filelock>=3.13",
    "httpx>=0.27",
    "msgspec>=0.20.0",
    "ocfl-lib",
    "platformdirs>=4.9.6",
    "pydantic-settings>=2.6",
    "pyzmq>=26",
    "typer>=0.15",
]

[project.scripts]
ocfl = "ocfl_cli:main"

[project.optional-dependencies]
s3 = [
    "ocfl-lib[s3]",
]
test = [
    "moto[s3]>=5.0.0",
]

[tool.uv.sources]
ocfl-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocfl_cli"]
