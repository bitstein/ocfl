[project]
name = "ocfl-cli"
version = "0.1.0"
description = "CLI for managing an OCFL archive"
requires-python = ">=3.14"
dependencies = [
    "ocfl-lib",
    "platformdirs>=4.9.6",
    "typer>=0.15",
]

[project.scripts]
ocfl = "ocfl_cli:main"

[project.optional-dependencies]
s3 = [
    "ocfl-lib[s3]",
]
test = [
    "moto[s3]>=5.0.0",
]

[tool.uv.sources]
ocfl-lib = { workspace = true }
